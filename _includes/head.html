{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<!-- http://t.co/dKP3o1e -->
<meta name="HandheldFriendly" content="True">
<meta name="MobileOptimized" content="320">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
  (function () {
    var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    try {
      var savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'light' || savedTheme === 'dark') dark = savedTheme === 'dark';
    } catch (error) { /* Use the system theme if storage is unavailable. */ }
    if (dark) document.documentElement.setAttribute('data-theme', 'dark');
    else document.documentElement.removeAttribute('data-theme');
  })();
</script>

<!-- For all browsers -->
<link rel="preload" as="font" type="font/woff2" href="{{ '/assets/fonts/instrument-serif/regular-latin.woff2' | relative_url }}" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="{{ '/assets/fonts/dm-sans/variable-latin.woff2' | relative_url }}" crossorigin>
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css">

<meta http-equiv="cleartype" content="on">
